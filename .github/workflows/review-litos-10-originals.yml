name: LITOS · Revisar 10 originales sin desplegar
on:
  push:
    branches:
      - work/catalogo-consola-banco-10png-20261011
    paths:
      - 'review/lote10-consola-banco.html'
      - 'scripts/build-litos-10-review.py'
      - 'scripts/check-litos-10-review.py'
      - 'docs/LOTE_10_IMAGENES_20261011.json'
      - 'assets/catalogo/variantes/*.png'
      - '.github/workflows/review-litos-10-originals.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    if: github.repository == 'litosartesania/litos_web'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify original PNG binary integrity
        run: python3 scripts/verify-litos-10-png.py
      - name: Assemble static offline viewer
        run: python3 scripts/build-litos-10-review.py
      - name: Verify no third-party content or data collection
        run: python3 scripts/check-litos-10-review.py
      - name: Save downloadable review, never deploy to Pages
        uses: actions/upload-artifact@v4
        with:
          name: litos-10-originales-vista-previa
          path: review-package/
          if-no-files-found: error
          retention-days: 7
