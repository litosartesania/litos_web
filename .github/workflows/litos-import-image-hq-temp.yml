name: LITOS temporary HQ images materialization
on:
  push:
    branches:
      - work/litos-fotos-hq-20261108
    paths:
      - 'tools/staging/hq-20261108/**'
      - '.github/workflows/litos-import-image-hq-temp.yml'
permissions:
  contents: write
jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct original high-resolution files with SHA-256 verification
        run: |
          python3 - <<'PY'
          import base64, hashlib, struct
          from pathlib import Path
          source = Path('tools/staging/hq-20261108')
          target = Path('assets/catalogo/conceptos/20261108')
          target.mkdir(parents=True, exist_ok=True)
          assets = [
            ('aux', 21, 'mesa-auxiliar-base-cruzada.png', 3624006, 'ca4040d010f7268dc727ff15868408f1a76c78cba122fd71f55c7161ef5e1258', (1408,1408)),
            ('parchis', 22, 'mesa-parchis-taracea-piedra.png', 3851042, '2f9da44af9a54d0f19695cebd4dfaef5e8cea982894117ad46c08029f05dc054', (1122,1402)),
          ]
          for prefix, n, filename, expected_size, digest, dimensions in assets:
            parts = sorted(source.glob(prefix+'.chunk-*'))
            assert len(parts)==n, (prefix,len(parts),n)
            payload=''.join(part.read_text(encoding='ascii') for part in parts)
            raw=base64.b64decode(payload, validate=True)
            assert len(raw)==expected_size, (filename,'size',len(raw))
            assert hashlib.sha256(raw).hexdigest()==digest, (filename,'hash')
            assert raw[:8]==b'\x89PNG\r\n\x1a\n', filename
            assert struct.unpack('>II',raw[16:24])==dimensions, (filename,'dimensions')
            (target/filename).write_bytes(raw)
            print('Verified and reconstructed', filename,dimensions,expected_size,'bytes')
          PY
      - name: Commit reviewed images on isolated branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/catalogo/conceptos/20261108/mesa-auxiliar-base-cruzada.png
          git add assets/catalogo/conceptos/20261108/mesa-parchis-taracea-piedra.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "assets(litos): incorporar imagenes HQ aportadas por el usuario"
          git push origin HEAD:work/litos-fotos-hq-20261108
