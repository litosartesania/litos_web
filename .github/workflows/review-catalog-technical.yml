name: LITOS · Vista técnica alzado planta perfil · Revisión aislada
on:
  push:
    branches: [work/catalogo-vista-planos-tecnicos-20261012]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    if: github.repository == 'litosartesania/litos_web'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JS, original 63 PNG hashes, static allowlist, privacy
        run: |
          node --check catalogo-precios.js
          python3 scripts/verify-litos-63-png.py
          sh scripts/build-site.sh
          python3 scripts/check-site.py _site --production
      - name: Install Chromium for responsive visual QA
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Test technical view and old material behaviors without deployment
        run: |
          python3 scripts/visual-qa.py
          python3 scripts/qa-catalog-sidebar.py
          python3 scripts/qa-catalog-card-detail.py
      - name: Build verified offline review with original PNGs intact
        run: |
          python3 scripts/build-litos-63-site-preview.py
          python3 scripts/check-litos-63-site-preview.py
      - uses: actions/upload-artifact@v4
        with:
          name: litos-vista-tecnica-previa-no-publicada
          path: |
            review-layout/screenshots/
            review-package/site/
          retention-days: 7
          if-no-files-found: error
