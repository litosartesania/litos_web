name: LITOS temporary import of approved teselas visual
on:
  push:
    branches:
      - work/murales-teselas-20261109
    paths:
      - "tools/staging/tessera-ref-20261109/**"
      - ".github/workflows/tessera-import-reference-temp.yml"
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image toolkit
        run: python -m pip install --quiet Pillow
      - name: Reconstruct and crop the exact approved reference
        run: |
          python - <<'PY'
          import base64,hashlib
          from pathlib import Path
          from PIL import Image,ImageFilter
          folder=Path("tools/staging/tessera-ref-20261109")
          parts=sorted(folder.glob("ref.chunk-*"))
          assert len(parts)==24, len(parts)
          source=base64.b64decode("".join(p.read_text("ascii") for p in parts),validate=True)
          assert len(source)==3567690
          assert hashlib.sha256(source).hexdigest()=="ea6d65f38b4fc3b88f16f6b3e58c5882fb3e634af938a5afdea57c4cc4546861"
          import io
          im=Image.open(io.BytesIO(source)).convert("RGB")
          assert im.size==(1536,1024)
          regions={
            "hero-velero":(695,64,1536,501),
            "motivos-geometricos":(52,688,393,924),
            "paisajes":(415,688,758,924),
            "elementos-naturales":(781,688,1123,924),
            "inspiracion-clasica":(1145,688,1488,924),
          }
          out=Path("assets/teselas")
          out.mkdir(parents=True,exist_ok=True)
          for name,area in regions.items():
            pic=im.crop(area)
            if name!="hero-velero":
              pic=pic.resize((pic.width*2,pic.height*2),Image.Resampling.LANCZOS).filter(ImageFilter.UnsharpMask(radius=1.1,percent=75,threshold=3))
            target=out/(name+".webp")
            pic.save(target,format="WEBP",quality=92,method=6)
            check=Image.open(target)
            assert check.size==pic.size
            assert target.stat().st_size>30000
            print("OK",str(target),check.size,target.stat().st_size,hashlib.sha256(target.read_bytes()).hexdigest())
          PY
      - name: Commit isolated gallery assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/teselas/hero-velero.webp assets/teselas/motivos-geometricos.webp assets/teselas/paisajes.webp assets/teselas/elementos-naturales.webp assets/teselas/inspiracion-clasica.webp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "assets(teselas): extract approved design photography"
          git push origin HEAD:work/murales-teselas-20261109
