name: LITOS isolated preview audit

on:
  push:
    branches:
      - 'work/luz-rasante-*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    name: Static audit and downloadable preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this branch
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check funerario-personalizador.js
          node --check funerario-compositor.js
          node --check funerario-exportar.js
          node --check tools/build-preview.mjs
          node --check tools/build-standalone.mjs
          node --check tools/build-funerario-ui.mjs
          node --check tools/extend-funerario-phase2.mjs
          node --check tools/extend-funerario-phase3.mjs
          node --check tools/build-funerario-phase3-gallery.mjs
          node --check tools/build-funerario-phase3-comparison.mjs
          node --check tools/build-funerario-gallery.mjs
      - name: Build and audit Codex public-site allowlist
        run: |
          sh scripts/build-site.sh
          python3 scripts/check-site.py _site
          python3 scripts/check-funerario.py
      - name: Validate publication safety gate without deploying
        run: |
          if python3 scripts/check-site.py _site --production > /tmp/litos-release-gate.log 2>&1; then
            echo "::error::Missing legal verification incorrectly passed production gate"
            exit 1
          fi
          if ! grep -q 'release blocked: legal identity and responsible party have not been verified' /tmp/litos-release-gate.log; then
            cat /tmp/litos-release-gate.log
            exit 1
          fi
          echo "Preview only; production blocked pending responsible-party verification"
      - name: Set up Chromium for responsive visual QA
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Run browser checks on all five pages and three viewport sizes
        run: python3 scripts/visual-qa.py
      - name: Prepare preview with disabled form submission
        run: |
          node tools/build-preview.mjs
          node tools/build-standalone.mjs
          node tools/build-funerario-preview.mjs
          node tools/build-funerario-gallery.mjs
          node tools/build-funerario-phase3-gallery.mjs
          node tools/build-funerario-phase3-comparison.mjs
      - name: Validate self-contained review HTML and disabled contact forms
        run: python3 scripts/check-preview.py preview
      - name: Verify memorial layers, long text, fonts, privacy and PNG downloads
        run: python3 scripts/qa-funerario.py
      - name: Verify isolated reliefs, three stones, safe zones and exported pixels
        run: python3 scripts/qa-funerario-phase3.py
      - name: Verify public figurative thumbnails, lazy full image and PNG
        run: python3 scripts/qa-funerario-public-loading.py
      - name: Verify every preset, accessory bounds and progressive mobile controls
        run: python3 scripts/qa-funerario-redesign.py
      - name: Verify optional ceramic image stays local and exports safely
        run: python3 scripts/qa-funerario-ceramic.py
      - name: Upload local review package (not a Pages deployment)
        uses: actions/upload-artifact@v4
        with:
          name: litos-offline-preview
          path: |
            preview/LITOS_PREVISUALIZACION_AUTONOMA.html
            preview/LITOS_CONFIGURADOR_FUNERARIO.html
            contact-screenshots/CONTACTO_index_390.png
            contact-screenshots/CONTACTO_index_1440.png
            contact-screenshots/CONTACTO_funerario_390.png
            contact-screenshots/CONTACTO_funerario_1440.png
            contact-screenshots/CONTACTO_mobiliario_390.png
            contact-screenshots/CONTACTO_mobiliario_1440.png
            preview/LITOS_TECNICAS_PR72.html
            preview/LITOS_PR72_320.png
            preview/LITOS_PR72_390.png
            preview/LITOS_PR72_768.png
            preview/LITOS_PR72_1440.png
            preview/LITOS_NICHO_CRUZ_VERTICAL.png
            preview/LITOS_BIBLIOTECA_FUNERARIA_FASE2.html
            preview/LITOS_REVISION_CRUCES_6.html
            preview/LITOS_PANEL_IZQUIERDO_390.png
            preview/LITOS_PANEL_IZQUIERDO_768.png
            preview/LITOS_PANEL_IZQUIERDO_1440.png
            preview/LITOS_REVISION_FIGURATIVOS_LOCALES.html
            preview/LITOS_REVISION_RELIEVES_FASE3.html
            preview/LITOS_GALERIA_RELIEVES_FASE3.html
            preview/LITOS_GALERIA_RELIEVES_FASE3.png
            preview/LITOS_COMPARACION_FIGURAS_FASE3.html
            preview/LITOS_COMPARACION_FIGURAS_FASE3.png
            preview/LITOS_FASE3_SUDAFRICA_RELIEVE.png
            preview/LITOS_FASE3_ITALIA_RELIEVE.png
            preview/LITOS_FASE3_QUINTANA_RELIEVE.png
          if-no-files-found: error
          retention-days: 7
