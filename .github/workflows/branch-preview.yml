name: LITOS isolated preview audit

on:
  push:
    branches:
      - 'work/luz-rasante-*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    name: Static audit and downloadable preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this branch
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check tools/build-preview.mjs
      - name: Verify allowlisted site and generate disabled-form preview
        run: node tools/build-preview.mjs
      - name: Upload local review package (not a Pages deployment)
        uses: actions/upload-artifact@v4
        with:
          name: litos-offline-preview
          path: preview/
          if-no-files-found: error
          retention-days: 7
