name: LITOS · Cinco columnas y detalle de producto · Revisión aislada
on:
  push:
    branches: [work/catalogo-grid-5-columnas-20261012]
    paths:
      - 'catalogo-precios.js'
      - 'mobiliario.html'
      - 'styles.css'
      - 'scripts/**'
      - '.github/workflows/review-catalog-grid5.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    if: github.repository == 'litosartesania/litos_web'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strict public allowlist, SHA-256 for 63 PNGs and privacy gate
        run: |
          python3 scripts/verify-litos-63-png.py
          node --check catalogo-precios.js
          sh scripts/build-site.sh
          python3 scripts/check-site.py _site --production
      - name: Install Chromium for responsive validation
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Verify all five pages, sidebar and five-column gallery/product modal
        run: |
          python3 scripts/visual-qa.py
          python3 scripts/qa-catalog-sidebar.py
          python3 scripts/qa-catalog-card-detail.py
      - name: Verify navigable local preview, no production deployment
        run: |
          python3 scripts/build-litos-63-site-preview.py
          python3 scripts/check-litos-63-site-preview.py
      - uses: actions/upload-artifact@v4
        with:
          name: litos-grid-cinco-columnas-detalle-preview
          path: |
            review-layout/screenshots/
            review-package/site/
          if-no-files-found: error
          retention-days: 7
